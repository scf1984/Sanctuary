[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctuary"
version = "0.1.0"
description = "An evolving-ecosystem simulation game."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# clients/viewer is not part of core (CLAUDE.md §3.2: core has no UI dependency) and stays
# optional so a headless install never pulls in a display library.
viewer = [
    "pygame>=2.5",
]

# core/, metrics/ and persistence/ are the installable packages (see CLAUDE.md §4). `metrics/` reads `core/` and
# never the reverse — a world that cannot be observed is a smaller loss than one that cannot run
# without an observer — so `core/` stays importable standalone. legacy/ is kept for reference only,
# does not run, and must never be packaged or imported by anything under core/.
[tool.setuptools.packages.find]
include = ["core*", "metrics*", "persistence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test modules are imported by importlib rather than by prepending their directory to sys.path,
# so a module's name is its full path and two `test_service.py` files in different packages no
# longer collide (#85). Under `prepend` — pytest's default — modules are keyed by basename alone,
# and a second file of the same name aborts collection of the *whole suite* rather than failing
# one test. `core/` already has `service.py` under both `genetics/` and `ecology/`, and the
# convention here is one `test_<module>.py` mirroring it, so collisions are the normal case.
addopts = ["--import-mode=importlib"]
# Required *because* of the line above: importlib mode does not touch sys.path at all, so the
# repository root is no longer added for us and `import core...` stops resolving in a working
# copy that was never `pip install -e .`'d. A root `conftest.py` used to supply this as a side
# effect of where it sat; stating it is the same behaviour without the indirection (§8.7).
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["legacy"]

# Pinned explicitly rather than left to whatever a given ruff version defaults to —
# pyflakes plus pycodestyle's error-level checks (unused/undefined names, syntax issues).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["legacy"]

# Coverage measures core/, metrics/ and persistence/, the whole scope the per-module threshold applies
# to (#47). `clients/` is still outside it — that gap is #182's, not this file's.
# clients/viewer cannot be imported in CI at all (no pygame in a headless install, CLAUDE.md §3),
# so including it would report a permanent false zero; tools/ is checked by running it.
[tool.coverage.run]
source = ["core", "metrics", "persistence"]
# Branch coverage is deliberately off. The gate exists to catch a module that arrived with no tests
# (see tools/check_coverage.py); branch percentages would make it a measure of path exhaustiveness
# instead, which CLAUDE.md §6 explicitly does not want carrying correctness weight here.
branch = false

[tool.coverage.report]
# `if __name__ == "__main__":` blocks and `...` protocol bodies never execute under pytest and are
# not evidence of anything untested.
exclude_also = [
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]
