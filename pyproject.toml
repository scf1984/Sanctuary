[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctuary"
version = "0.1.0"
description = "An evolving-ecosystem simulation game."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# clients/viewer is not part of core (CLAUDE.md §3.2: core has no UI dependency) and stays
# optional so a headless install never pulls in a display library.
viewer = [
    "pygame>=2.5",
]

# core/ is the only installable package (see CLAUDE.md §4); legacy/ is kept for reference
# only, does not run, and must never be packaged or imported by anything under core/.
[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["legacy"]

# Pinned explicitly rather than left to whatever a given ruff version defaults to —
# pyflakes plus pycodestyle's error-level checks (unused/undefined names, syntax issues).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["legacy"]
