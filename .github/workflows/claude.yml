# Delegated implementation for the Sanctuary backlog. See issue #44.
#
# Tag mode: mentioning @claude on an issue or pull request starts a run. The
# backlog was written specifically to make this work - every issue carries an
# abstraction contract, a binding blocker list, and a definition of done - so the
# agent's job here is to follow a specification, not to invent one.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two conditions, both required.
    #
    # The first is the @claude mention, which lives in a different field per event.
    #
    # The second is an access gate. This repository is public, so without it any
    # passer-by could open an issue containing "@claude" and start a run.
    # claude-code-action independently refuses actors without write access, so
    # this is the cheaper of two gates: it declines before a runner starts rather
    # than after. Two independent checks, because a workflow condition is easier
    # to get subtly wrong than the action's own check, and neither should be the
    # only thing between a public repository and someone else's token spend.
    #
    # The author_association coalescing relies on GitHub expressions returning the
    # first truthy operand of ||, so a comment's association wins on comment
    # events and falls through to the issue's on `issues` events.
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association ||
        github.event.review.author_association ||
        github.event.issue.author_association
      )
    runs-on: ubuntu-latest
    # A runaway agent should cost an hour, not a weekend.
    timeout-minutes: 60
    permissions:
      # Deliberately read-only on contents. The action mints its own installation
      # token via OIDC to push branches, so the workflow never needs write access
      # itself - which means a mistake here cannot reach master.
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history. CLAUDE.md section 8.2 requires every line to be
          # justifiable, and section 1 catalogues prototype defects that are only
          # legible with blame available.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        env:
          # gh is not authenticated in the runner by default. Without this the
          # agent cannot read issue state at all, which makes CLAUDE.md section
          # 7.1 - check your blockers before starting - unenforceable in
          # practice: agents were reporting that they could not query the API
          # and proceeding anyway. Carries only the read-only permissions
          # declared above, so it can inspect issues but not alter them.
          GH_TOKEN: ${{ github.token }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Passed explicitly rather than relying on the project file being
          # auto-discovered. Agents reported every gh and python command coming
          # back as "This command requires approval" even though the rules were
          # committed, so auto-discovery cannot be assumed to be happening here.
          settings: .claude/settings.json

          # Lets Claude read CI results on pull requests.
          additional_permissions: |
            actions: read

          # Standing instructions use --append-system-prompt rather than the
          # `prompt` input: in tag mode `prompt` supplements the triggering
          # comment, so rules placed there would be mixed into the user's request
          # instead of acting as guidance.
          #
          # CLAUDE.md loads automatically and is not duplicated here. This
          # restates only the rules most likely to be skipped under delegation -
          # the ones whose violation produces work that has to be thrown away.
          claude_args: |
            --append-system-prompt "This repository's CLAUDE.md is binding. Before starting any issue, read its 'Blocked by' section and check the current state of each blocker with 'gh issue view <n> --json state' - a blocker listed in the body may have closed since the issue was written, so the body alone is not authoritative. gh is authenticated and read-only queries are pre-approved; do not assume you lack API access without trying. If any blocker is still open, comment saying so and stop. Do not stub, mock, or temporarily reimplement a blocker's scope in order to proceed - that is how two incompatible versions of the same abstraction get built (section 7.1). Do not redesign an abstraction owned by another issue; if you cannot build against it, say so rather than working around it locally (section 7.2). Write the test before the implementation wherever the contract is checkable in advance, and always for a bug fix (section 8.1). Every line you add must be justifiable: no code for later, no parameter without a caller that needs it now, no defensive checks against conditions that cannot occur, no commented-out code (section 8.2). State shape, dtype and unit on every array attribute (section 8.4). Cite a benchmark for any performance claim (section 8.5)."
